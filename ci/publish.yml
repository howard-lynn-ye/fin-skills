name: publish
# NOT ACTIVE YET - see ci/README.md. Cannot live at .github/workflows/publish.yml
# until the maintainer grants the `workflow` OAuth scope.
# Publishes fin-skills to PyPI on a GitHub release, with no API token stored anywhere:
# PyPI "trusted publishing" (OIDC). One-time setup on pypi.org -> project -> Publishing:
#   owner howard-lynn-ye, repository fin-skills, workflow publish.yml, environment pypi.
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The package must be in sync with the skills before it ships
        run: |
          python scripts/validate.py
          python scripts/build_package.py --check
      - run: |
          pip install --quiet build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
