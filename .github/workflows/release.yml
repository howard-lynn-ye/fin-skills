name: Build release candidate
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[stats,dev]"
      - run: python scripts/validate.py
      - run: python scripts/check_release.py
      - run: python scripts/check_release.py --tag "${{ github.ref_name }}"
        if: github.ref_type == 'tag'
      - run: python -m pytest -q
      - run: python scripts/check_distribution.py --output release-dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-candidate
          path: release-dist/*
