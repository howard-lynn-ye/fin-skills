name: CI

on:
  push:
    branches: [ main, master, v2 ]
  pull_request:
    branches: [ main, master, v2 ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-github-actions-annotate-failures

      - name: Validate Agent Skills specification
        run: |
          python scripts/validate.py

      - name: Run Core API Tests
        run: |
          pytest tests/test_api.py tests/test_api_bundle.py -v

      - name: Run Full Test Suite
        run: |
          pytest -ra --tb=short || {
            echo "::error::Pytest failed. Inspecting failed tests:"
            python3 -c "import json, os; p='.pytest_cache/v/cache/lastfailed'; print('\n'.join(f'::error title=FailedTest::{k}' for k in json.load(open(p)))) if os.path.exists(p) else None"
            exit 1
          }

      - name: Run Leak Detection Benchmark
        run: |
          python benchmarks/leak_bench.py
