[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-skills"
version = "0.1.0"
description = "Source-verified knowledge base of the Python quant-finance ecosystem - the Agent Skills as importable text, and their executable guards as importable functions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Howard Ye" }]
keywords = ["quantitative-finance", "agent-skills", "backtesting", "market-data", "claude-code", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2.2",
    "scipy>=1.11.4",
]

[project.optional-dependencies]
# scripts that verify themselves against a real library when it is importable
stats = ["statsmodels>=0.14", "scikit-learn>=1.3"]
collect = ["pypdf>=5.0"]
# the Model Context Protocol server (fin_skills.mcp). The official SDK, MIT licensed;
# v2 is the current stable line and the one fin_skills.mcp targets - its low-level
# Server takes constructor handlers and a hand-written inputSchema, which is what a
# derived schema needs. Optional on purpose: fin_skills imports and works without it.
mcp = ["mcp>=2.0"]
all = ["statsmodels>=0.14", "scikit-learn>=1.3", "mcp>=2.0", "pypdf>=5.0"]
algorithms = ["statsmodels>=0.14", "scikit-learn>=1.3", "arch>=7", "statsforecast>=2",
              "hmmlearn>=0.3", "ruptures>=1.1", "lightgbm>=4", "xgboost>=2", "QuantLib>=1.35"]
qlib = ["pyqlib>=0.9.6"]
# PyPortfolioOpt HRP uses SciPy's private _LINKAGE_METHODS (absent in 1.18).
# Keep the tested 1.16 line available until the upstream call is replaced.
optimizers = ["PyPortfolioOpt>=1.5", "skfolio>=0.8", "Riskfolio-Lib>=7", "scipy<1.17"]
deep = ["neuralforecast>=3,<4"]
methods = ["TA-Lib>=0.6,<0.7", "cvxportfolio>=1.5,<2", "statsmodels>=0.14",
           "scikit-learn>=1.3", "arch>=7", "Riskfolio-Lib>=7", "PyPortfolioOpt>=1.5",
           "scipy<1.17"]
lean = ["json5>=0.9"]
rl = ["stable-baselines3>=2.4,<3", "gymnasium>=0.29,<2"]
agent = ["autogen-agentchat>=0.7,<0.8", "autogen-ext[openai]>=0.7,<0.8", "jsonschema>=4"]
dev = ["pytest>=7", "pytest-cov>=5", "build>=1", "twine>=5", "jsonschema>=4",
       "tomli>=2; python_version < '3.11'"]

[project.scripts]
fin-skills-mcp = "fin_skills.mcp:main"
fin-skills-collect = "fin_skills.collect.__main__:main"
fin-skills-doctor = "fin_skills.algorithms.diagnostics:main"

[project.urls]
Homepage = "https://github.com/howard-lynn-ye/fin-skills"
Repository = "https://github.com/howard-lynn-ye/fin-skills"
Issues = "https://github.com/howard-lynn-ye/fin-skills/issues"

[tool.setuptools.packages.find]
include = ["fin_skills*"]

[tool.setuptools.package-data]
fin_skills = ["_skills/**/*.md", "_skills/*.json"]

[tool.pytest.ini_options]
# The suite lives in tests/. Tests marked `slow` (the long demo paths) are deselected by
# default; run them with:   python -m pytest -q -m slow
# python_files is restricted to test_*.py so pytest's assertion-rewriting import hook does not
# claim the generated module fin_skills/core/fold_leak_test.py (its name matches the default
# *_test.py pattern), which would break running that module's __main__ demo through runpy.
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long-running demo paths - regime_lookahead (~40-75 s), purge_effect main (~30 s), microstructure_measures (~10-20 s), test_examples (~10 s of subprocesses), the event_study and spa_test replication demos and the leveraged_reset Monte Carlo. Deselected by default via addopts; run with -m slow",
]
