[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-skills-fly"
version = "0.1.0"
description = "Experimental GPL mushroom-body memory extension for fin-skills"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.24", "scipy>=1.11.4"]

[tool.setuptools]
packages = ["fin_skills_fly"]
package-dir = {fin_skills_fly = "."}
license-files = ["COPYING.txt"]

[tool.setuptools.package-data]
fin_skills_fly = ["COPYING.txt", "README.md"]
